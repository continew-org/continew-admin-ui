name: ❓ 使用咨询
description: 咨询 ContiNew Admin UI 的使用或设计相关问题
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        提问前建议先查阅[使用指南](https://continew.top/docs/admin/guide/quick-start.html)、[常见问题](https://continew.top/docs/admin/faq.html)，多数使用问题都能快速找到答案。

        > 后端接口相关的问题（如接口报错、权限配置）请提交至 [ContiNew Admin](https://github.com/continew-org/continew-admin/issues/new/choose)。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我确认这是使用咨询而非 Bug 报告（Bug 请使用 Bug 报告模板）
          required: true
        - label: 我确认已搜索 Issue 广场，没有类似问题
          required: true
        - label: 我确认这是 ContiNew Admin UI 自身的问题，而非后端或组件库的问题
          required: true
  - type: input
    id: version
    attributes:
      label: ContiNew Admin UI 版本
      placeholder: 例如：4.2.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 详细描述你的问题，请提供尽可能多的上下文信息。
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 已尝试的方法
      description: 描述你已经尝试过的排查或解决方案。
    validations:
      required: false
